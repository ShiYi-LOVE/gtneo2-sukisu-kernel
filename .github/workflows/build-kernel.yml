name: Build GT Neo 2 Kernel (SukiSU-Ultra + SusFS)

on:
  workflow_dispatch:
    inputs:
      defconfigs:
        description: "defconfig 列表（空格分隔）"
        required: false
        default: "vendor/kona-perf_defconfig vendor/kona_defconfig"
      skip_su:
        description: "跳过 SukiSU/SusFS，构建纯净对照内核（1=跳过，留空=正常）"
        required: false
        default: "0"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          echo "matrix=$(echo "${{ github.event.inputs.defconfigs }}" | tr ' ' '\n' | jq -R '{defconfig: ., tag: (sub("vendor/";"") | sub("_defconfig";""))}' | jq -sc .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libssl-dev make zip jq patch python3 zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Build kernel (${{ matrix.defconfig }})
        env:
          SKIP_SU: ${{ github.event.inputs.skip_su || '0' }}
        run: |
          # 防 CRLF: 曾经有一次经 API 提交把 build.sh 的行尾改成 CRLF,
          # shebang 变成 '#!/usr/bin/env bash\r', 直接 exit 127。
          sed -i 's/\r$//' build.sh
          chmod +x build.sh
          bash ./build.sh "${{ matrix.defconfig }}" "${{ matrix.tag }}"

      - name: Upload AK3 flashable zip + Image
        uses: actions/upload-artifact@v4
        with:
          name: AK3-gtneo2-${{ matrix.tag }}-${{ github.event.inputs.skip_su == '1' && 'stock' || 'SukiSU-susfs' }}
          path: |
            out/AK3-*.zip
            out/Image
            out/kernel.config
            out/vermagic-info.txt
          if-no-files-found: error
